<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icona di Shoot Your Friends: fucile low-poly che spara a un omino a blocchi che va in pezzi -->
  <defs>
    <radialGradient id="bg" cx="70%" cy="30%" r="85%">
      <stop offset="0" stop-color="#ffb14a"/>
      <stop offset="0.55" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#b8262a"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- raggi dell'esplosione dietro all'omino -->
  <g fill="#fff3c4" opacity="0.35">
    <polygon points="400,170 512,40 512,120"/>
    <polygon points="400,170 300,0 380,0"/>
    <polygon points="400,170 512,230 512,300"/>
  </g>
  <!-- scie dei pallini -->
  <g stroke="#fff6cf" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <line x1="318" y1="262" x2="372" y2="196"/>
    <line x1="322" y1="270" x2="400" y2="226"/>
    <line x1="312" y1="254" x2="345" y2="170"/>
  </g>
  <!-- omino che va in pezzi -->
  <g stroke="#1b2433" stroke-width="6" stroke-linejoin="round">
    <rect x="352" y="242" width="30" height="78" fill="#3b3b4a" transform="rotate(18 367 281)"/>
    <rect x="428" y="226" width="30" height="78" fill="#3b3b4a" transform="rotate(-28 443 265)"/>
    <rect x="360" y="150" width="78" height="84" fill="#4f7cc9" transform="rotate(-12 399 192)"/>
    <rect x="452" y="128" width="26" height="74" fill="#4f7cc9" transform="rotate(42 465 165)"/>
    <rect x="318" y="122" width="26" height="70" fill="#4f7cc9" transform="rotate(-55 331 157)"/>
    <g transform="rotate(20 414 88)">
      <rect x="374" y="48" width="80" height="80" fill="#f2c9a0"/>
      <rect x="374" y="48" width="80" height="20" fill="#4a2f1d"/>
      <path d="M390 80 l14 14 M404 80 l-14 14 M424 80 l14 14 M438 80 l-14 14" stroke="#1b2433" stroke-width="6"/>
      <ellipse cx="414" cy="112" rx="11" ry="9" fill="#5a1a14" stroke="none"/>
    </g>
  </g>
  <!-- schegge -->
  <g stroke="#1b2433" stroke-width="4">
    <rect x="470" y="96" width="18" height="18" fill="#4f7cc9" transform="rotate(30 479 105)"/>
    <rect x="340" y="40" width="16" height="16" fill="#f2c9a0" transform="rotate(-20 348 48)"/>
    <rect x="476" y="300" width="16" height="16" fill="#3b3b4a" transform="rotate(15 484 308)"/>
    <rect x="452" y="44" width="14" height="14" fill="#4f7cc9"/>
  </g>
  <!-- lampo della canna -->
  <polygon fill="#ffd54a" stroke="#fff" stroke-width="4" points="322,262 352,248 330,234 346,208 318,224 310,194 300,226 270,218 290,244 262,262 292,272 282,300 308,280 324,304 324,274"/>
  <!-- fucile a pompa low-poly -->
  <g transform="translate(40 452) rotate(-30) scale(0.95)" stroke="#11141a" stroke-width="6" stroke-linejoin="round">
    <polygon points="0,-6 96,-24 104,22 8,48" fill="#8a5a2b"/>
    <rect x="96" y="-30" width="84" height="44" fill="#2a2f38"/>
    <polygon points="118,12 150,12 140,58 112,58" fill="#8a5a2b"/>
    <rect x="176" y="-26" width="170" height="17" fill="#4a505c"/>
    <rect x="176" y="-8" width="140" height="13" fill="#2a2f38"/>
    <rect x="212" y="-12" width="72" height="28" fill="#a66c33"/>
    <rect x="330" y="-34" width="10" height="9" fill="#d2452f"/>
  </g>
</svg>
