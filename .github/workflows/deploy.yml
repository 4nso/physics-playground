# Pubblica il gioco su GitHub Pages a ogni push su main.
# Fase 0: pubblica il prototipo così com'è.
# Dalla fase 1 va sostituito con la build Vite (npm ci && npm run build → dist/).
name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara il sito
        run: |
          mkdir -p _site
          cp prototype/physics-playground.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
